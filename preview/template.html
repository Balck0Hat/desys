<title>desys Showcase</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=__GOOGLE_FONTS__&display=swap">
<style>
/* Layout: sticky chrome bar with system tabs; one full-width panel per system rendered in its own tokens. */
:root {
  --bg: #f3f4f6; --fg: #15171c; --muted: #5f6672; --line: #d9dce2; --panel: #ffffff;
  --chrome-font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0e1013; --fg: #e7e9ee; --muted: #9aa1ad; --line: #262a31; --panel: #15181d; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0e1013; --fg: #e7e9ee; --muted: #9aa1ad; --line: #262a31; --panel: #15181d; color-scheme: dark; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--chrome-font); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar-inner { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding-block: 10px; max-width: 1200px; margin-inline: auto; }
.wordmark { font-weight: 700; letter-spacing: -0.01em; font-size: 15px; }
.wordmark small { color: var(--muted); font-weight: 400; margin-inline-start: 8px; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab { border: 1px solid transparent; background: none; color: var(--muted); font: inherit; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
.tab:hover { color: var(--fg); background: var(--panel); }
.tab[aria-selected="true"] { color: var(--fg); background: var(--panel); border-color: var(--line); font-weight: 600; }
.tab:focus-visible, .seg button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.seg { margin-inline-start: auto; display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: none; color: var(--muted); font: inherit; padding: 6px 10px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--fg); font-weight: 600; }

/*__SYSTEM_CSS__*/

.panel { background: var(--surface); color: var(--fg); font-family: var(--font-sans); }
.panel[hidden] { display: none; }
.wrap { max-width: 1200px; margin-inline: auto; padding-block: 40px 56px; display: grid; gap: 40px; }
.panel h1, .panel h2, .panel h3 { margin: 0; font-family: var(--font-display); text-wrap: balance; }
.panel p { margin: 0; }
.section-title { font-size: 13px; color: var(--fg-secondary); margin: 0 0 12px; font-weight: 500; }

.hero { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 900px) { .hero { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); } }
.hero h1 { font-size: clamp(36px, 6vw, 56px); line-height: 1.05; letter-spacing: -0.02em; font-weight: 700; }
.hero .tagline { font-size: 18px; line-height: 1.5; color: var(--fg-secondary); margin-top: 16px; max-width: 48ch; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
.chip { font-size: 13px; padding: 4px 12px; border-radius: var(--r-full); background: var(--surface-muted); color: var(--fg-secondary); border: 1px solid var(--edge); }
.meta { display: grid; gap: 10px; font-size: 14px; color: var(--fg-secondary); align-content: start; }
.meta b { color: var(--fg); font-weight: 600; }
.sig { border-radius: var(--r-lg); padding: 24px; min-height: 140px; display: flex; align-items: flex-end; }

.palette { display: grid; gap: 10px; }
.row { display: grid; grid-template-columns: 72px repeat(11, minmax(0, 1fr)); gap: 4px; align-items: center; }
.row span:first-child { font-size: 12px; color: var(--fg-secondary); }
.sw { height: 28px; border-radius: var(--r-sm); border: 1px solid var(--edge); }
.status { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
.status div { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--fg-secondary); }
.status i { display: inline-block; width: 16px; height: 16px; border-radius: var(--r-sm); }

.type { display: grid; gap: 14px; }
.type .display { font-family: var(--font-display); font-size: 48px; line-height: 1.1; letter-spacing: -0.02em; font-weight: 700; }
.type .h3 { font-family: var(--font-display); font-size: 24px; line-height: 1.3; font-weight: 600; }
.type .body { font-size: 16px; line-height: 1.65; max-width: 65ch; color: var(--fg); }
.type .cap { font-size: 12px; color: var(--fg-muted); font-weight: 500; }

.grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.grid > div { min-width: 0; }
.cluster { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

.btn { font: inherit; font-weight: 600; font-size: 14px; height: 44px; padding: 0 20px; border-radius: var(--r-md); border: 1px solid transparent; cursor: pointer; transition: transform var(--dur) var(--ease-out), background-color var(--dur), box-shadow var(--dur); }
.btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.btn-primary { background: var(--btn-bg); color: var(--btn-fg); }
.btn-primary:hover { background: var(--btn-bg-hover); }
.btn-secondary { background: var(--surface-elevated); color: var(--fg); border-color: var(--edge); }
.btn-secondary:hover { background: var(--surface-muted); }
.btn-ghost { background: none; color: var(--fg-secondary); }
.btn-ghost:hover { background: var(--surface-muted); color: var(--fg); }
.btn-danger { background: var(--err-600); color: #fff; }

.field { display: grid; gap: 6px; }
.field label { font-size: 14px; font-weight: 500; color: var(--fg-secondary); }
.field input { font: inherit; font-size: 14px; height: 44px; padding: 0 12px; border-radius: var(--r-md); border: 1px solid var(--edge); background: var(--surface-elevated); color: var(--fg); width: 100%; }
.field input::placeholder { color: var(--fg-muted); }
.field input:focus { outline: 2px solid var(--focus); outline-offset: 1px; }
.field.err input { border-color: var(--err-500); }
.field .msg { font-size: 13px; color: var(--err-600); }

.card { background: var(--surface-elevated); border: 1px solid var(--edge); border-radius: var(--r-lg); padding: 24px; display: grid; gap: 10px; }
.card h3 { font-size: 18px; }
.card p { color: var(--fg-secondary); font-size: 14px; }
.badge { display: inline-block; font-size: 12px; font-weight: 500; padding: 2px 10px; border-radius: var(--r-full); background: var(--ok-50); color: var(--ok-700); border: 1px solid transparent; width: max-content; }
.kpi .label { font-size: 14px; color: var(--fg-secondary); }
.kpi .value { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi .delta { font-size: 13px; color: var(--ok-700); font-weight: 500; }

.tablewrap { overflow-x: auto; border: 1px solid var(--edge); border-radius: var(--r-lg); background: var(--surface-elevated); }
table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 420px; }
th { text-align: start; font-size: 12px; font-weight: 600; color: var(--fg-secondary); background: var(--surface-muted); height: 40px; padding: 0 12px; }
td { height: 48px; padding: 0 12px; border-top: 1px solid var(--edge); }
td.num, th.num { text-align: end; font-variant-numeric: tabular-nums; }
tr:hover td { background: var(--surface-muted); }

.toast { display: flex; gap: 12px; align-items: center; background: var(--surface-elevated); border: 1px solid var(--edge); border-radius: var(--r-lg); padding: 14px 16px; box-shadow: var(--sh-lg); font-size: 14px; }
.toast i { width: 20px; height: 20px; border-radius: var(--r-full); background: var(--ok-500); flex: none; }
.nav { display: grid; gap: 4px; background: var(--surface-muted); border: 1px solid var(--edge); border-radius: var(--r-lg); padding: 8px; }
.nav a { display: block; text-decoration: none; color: var(--fg-secondary); font-size: 14px; height: 40px; line-height: 40px; padding: 0 12px; border-radius: var(--r-md); }
.nav a.active { background: var(--nav-bg); color: var(--nav-fg); font-weight: 600; box-shadow: inset 2px 0 0 var(--nav-bar); }

/* Aurora: depth from borders; the single gradient band is the signature. */
.sys-aurora { --btn-bg: var(--p-600); --btn-fg: var(--fg-inverse); --btn-bg-hover: var(--p-700); --nav-bg: var(--p-50); --nav-fg: var(--p-700); --nav-bar: var(--p-600); }
.sys-aurora .sig { background: linear-gradient(135deg, var(--p-600), var(--s-500)); color: #fff; }
.sys-aurora .card:hover { border-color: var(--edge-strong); box-shadow: var(--sh-sm); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .sys-aurora { --nav-bg: var(--p-950); --nav-fg: var(--p-300); } }
:root[data-theme="dark"] .sys-aurora { --nav-bg: var(--p-950); --nav-fg: var(--p-300); }

/* Ledger: 14px body, 1px rules everywhere, one 3px ledger line under the title. */
.sys-ledger { --btn-bg: var(--p-700); --btn-fg: #fff; --btn-bg-hover: var(--p-800); --nav-bg: var(--p-50); --nav-fg: var(--p-800); --nav-bar: var(--p-700); }
.sys-ledger .hero h1 { font-size: clamp(28px, 4vw, 36px); letter-spacing: 0; padding-bottom: 12px; border-bottom: 3px solid var(--p-700); }
.sys-ledger .sig { background: var(--surface-muted); border: 1px solid var(--edge); color: var(--fg-secondary); font-size: 14px; }
.sys-ledger .type .display { font-size: 36px; font-weight: 600; letter-spacing: 0; }
.sys-ledger .btn-danger { background: none; color: var(--err-700); border-color: var(--err-300); }
.sys-ledger .btn, .sys-ledger .field input { height: 40px; }
.sys-ledger .field input { border-color: var(--edge-strong); }
.sys-ledger .badge { border-radius: var(--r-md); background: var(--ok-50); color: var(--ok-800); border-color: var(--ok-200); }
.sys-ledger td { height: 40px; }
.sys-ledger .toast { box-shadow: var(--sh-lg); border-inline-start: 3px solid var(--ok-600); border-radius: var(--r-md); }
.sys-ledger .wrap { gap: 32px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .sys-ledger { --btn-bg: var(--p-600); --btn-bg-hover: var(--p-700); --nav-bg: var(--p-950); --nav-fg: var(--p-200); } }
:root[data-theme="dark"] .sys-ledger { --btn-bg: var(--p-600); --btn-bg-hover: var(--p-700); --nav-bg: var(--p-950); --nav-fg: var(--p-200); }

/* Ember: 2px ink borders and hard offset shadows on anything interactive. Dark text on orange, always. */
.sys-ember { --btn-bg: var(--p-500); --btn-fg: var(--fg); --btn-bg-hover: var(--p-400); --nav-bg: var(--p-100); --nav-fg: var(--fg); --nav-bar: transparent; }
.sys-ember .sig { background: var(--s-100); border: 2px solid var(--edge); border-radius: var(--r-xl); color: var(--fg); position: relative; }
.sys-ember .sticker { position: absolute; top: -14px; inset-inline-end: 20px; background: var(--s-400); border: 2px solid var(--edge); border-radius: var(--r-full); padding: 8px 16px; font-weight: 700; transform: rotate(-3deg); box-shadow: var(--sh-sm); font-family: var(--font-display); }
.sys-ember .btn { border: 2px solid var(--edge); box-shadow: var(--sh-md); font-weight: 700; height: 48px; padding: 0 24px; }
.sys-ember .btn:hover { transform: translate(-2px, -2px); box-shadow: var(--sh-lg); }
.sys-ember .btn:active { transform: translate(4px, 4px); box-shadow: none; }
.sys-ember .btn-ghost { border-color: transparent; box-shadow: none; }
.sys-ember .btn-danger { background: var(--err-100); color: var(--err-800); }
.sys-ember .field input { height: 48px; border: 2px solid var(--edge); border-radius: var(--r-lg); box-shadow: var(--sh-sm); }
.sys-ember .field label { color: var(--fg); font-weight: 700; }
.sys-ember .card { border: 2px solid var(--edge); border-radius: var(--r-xl); box-shadow: var(--sh-md); }
.sys-ember .badge, .sys-ember .chip { border: 2px solid var(--edge); color: var(--fg); background: var(--ok-100); font-weight: 500; }
.sys-ember .chip { background: var(--p-100); }
.sys-ember .tablewrap { border: 2px solid var(--edge); }
.sys-ember th { background: var(--p-100); color: var(--fg); font-weight: 700; }
.sys-ember .toast { border: 2px solid var(--edge); box-shadow: var(--sh-md); }
.sys-ember .toast i { border-radius: var(--r-sm); width: 28px; height: 28px; background: var(--ok-100); border: 2px solid var(--edge); }
.sys-ember .nav { border: 2px solid var(--edge); }
.sys-ember .nav a.active { border: 2px solid var(--edge); line-height: 36px; }
.sys-ember .sw { border-color: var(--edge); }
.sys-ember .hero .tagline { color: var(--fg-secondary); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .sys-ember { --nav-bg: var(--p-950); } :root:not([data-theme="light"]) .sys-ember .sig { background: var(--s-950); } :root:not([data-theme="light"]) .sys-ember .chip { background: var(--p-950); } :root:not([data-theme="light"]) .sys-ember th, :root:not([data-theme="light"]) .sys-ember .badge { background: var(--p-950); } }
:root[data-theme="dark"] .sys-ember { --nav-bg: var(--p-950); }
:root[data-theme="dark"] .sys-ember .sig { background: var(--s-950); }
:root[data-theme="dark"] .sys-ember .chip, :root[data-theme="dark"] .sys-ember th, :root[data-theme="dark"] .sys-ember .badge { background: var(--p-950); }

.foot { max-width: 1200px; margin-inline: auto; padding-block: 28px 40px; color: var(--muted); font-size: 13px; display: grid; gap: 8px; }
.foot code { font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; color: var(--fg); }
.foot a { color: var(--fg); }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } .sys-ember .btn:hover { transform: none; } }
</style>

<header class="bar gutter">
  <div class="bar-inner">
    <div class="wordmark">desys <small>design-system registry</small></div>
    <nav class="tabs" role="tablist" aria-label="Design systems" id="tabs"></nav>
    <div class="seg" role="group" aria-label="Theme" id="theme">
      <button type="button" data-mode="light">Light</button>
      <button type="button" data-mode="system" aria-pressed="true">System</button>
      <button type="button" data-mode="dark">Dark</button>
    </div>
  </div>
</header>

<main id="panels"></main>

<footer class="foot gutter">
  <div>Apply any of these to a project from Claude Code with <code>/desys aurora</code>, or from a terminal with <code>desys use aurora ./my-app</code>.</div>
  <div>Source and specs: <a href="https://github.com/Balck0Hat/desys">github.com/Balck0Hat/desys</a>. Each system is <code>systems/&lt;name&gt;/DESIGN.md</code> + <code>tokens.json</code>.</div>
</footer>

          <div class="sig" data-f="sig"></div>
          <div>Display: <b data-f="display"></b> · Body: <b data-f="sans"></b></div>

      <div>

          <div class="row"><span>primary</span><i class="sw" style="background:var(--p-50)"></i><i class="sw" style="background:var(--p-100)"></i><i class="sw" style="background:var(--p-200)"></i><i class="sw" style="background:var(--p-300)"></i><i class="sw" style="background:var(--p-400)"></i><i class="sw" style="background:var(--p-500)"></i><i class="sw" style="background:var(--p-600)"></i><i class="sw" style="background:var(--p-700)"></i><i class="sw" style="background:var(--p-800)"></i><i class="sw" style="background:var(--p-900)"></i><i class="sw" style="background:var(--p-950)"></i></div>
          <div class="row"><span>secondary</span><i class="sw" style="background:var(--s-50)"></i><i class="sw" style="background:var(--s-100)"></i><i class="sw" style="background:var(--s-200)"></i><i class="sw" style="background:var(--s-300)"></i><i class="sw" style="background:var(--s-400)"></i><i class="sw" style="background:var(--s-500)"></i><i class="sw" style="background:var(--s-600)"></i><i class="sw" style="background:var(--s-700)"></i><i class="sw" style="background:var(--s-800)"></i><i class="sw" style="background:var(--s-900)"></i><i class="sw" style="background:var(--s-950)"></i></div>
          <div class="row"><span>neutral</span><i class="sw" style="background:var(--n-50)"></i><i class="sw" style="background:var(--n-100)"></i><i class="sw" style="background:var(--n-200)"></i><i class="sw" style="background:var(--n-300)"></i><i class="sw" style="background:var(--n-400)"></i><i class="sw" style="background:var(--n-500)"></i><i class="sw" style="background:var(--n-600)"></i><i class="sw" style="background:var(--n-700)"></i><i class="sw" style="background:var(--n-800)"></i><i class="sw" style="background:var(--n-900)"></i><i class="sw" style="background:var(--n-950)"></i></div>

<script>
(() => {
  const systems = __SYSTEMS_JSON__;
  const SIG = {
    aurora: () => { const d = document.createElement('div'); d.innerHTML = '<strong style="font-size:18px;display:block">The aurora band</strong><span style="opacity:.85">One gradient per page: the header or the main CTA. Nothing else.</span>'; return d; },
    ledger: () => { const d = document.createElement('div'); d.innerHTML = '<strong style="color:var(--fg);display:block">The ledger line</strong>A 3px rule under the page title is the only thick line on screen. Every other divider is 1px.'; return d; },
    ember: () => { const d = document.createElement('div'); d.innerHTML = '<span class="sticker">New!</span><strong style="font-size:18px;display:block;font-family:var(--font-display)">Ink</strong><span>2px borders and hard offset shadows on anything you can press.</span>'; return d; },
  };

  const tabs = document.getElementById('tabs');
  const panels = document.getElementById('panels');
  const tpl = document.getElementById('panel-tpl');

  systems.forEach((s, i) => {
    const tab = document.createElement('button');
    tab.type = 'button'; tab.className = 'tab'; tab.role = 'tab'; tab.id = `tab-${s.name}`;
    tab.textContent = s.title; tab.setAttribute('aria-controls', `panel-${s.name}`);
    tab.addEventListener('click', () => select(s.name, true));
    tabs.appendChild(tab);

    const node = tpl.content.firstElementChild.cloneNode(true);
    node.id = `panel-${s.name}`; node.classList.add(`sys-${s.name}`); node.setAttribute('aria-labelledby', tab.id);
    node.querySelector('[data-f="title"]').textContent = s.title;
    node.querySelector('[data-f="tagline"]').textContent = s.tagline;
    node.querySelector('[data-f="display"]').textContent = s.fonts.display;
    node.querySelector('[data-f="sans"]').textContent = s.fonts.sans;
    node.querySelector('[data-f="personality"]').textContent = s.personality;
    const chips = node.querySelector('[data-f="chips"]');
    (s.bestFor || []).forEach((b) => { const c = document.createElement('span'); c.className = 'chip'; c.textContent = b; chips.appendChild(c); });
    node.querySelector('[data-f="sig"]').appendChild((SIG[s.name] || SIG.aurora)());
    node.querySelectorAll('a[href="#"]').forEach((a) => a.addEventListener('click', (e) => e.preventDefault()));
    panels.appendChild(node);
  });

  function select(name, push) {
    if (!systems.some((s) => s.name === name)) name = systems[0].name;
    systems.forEach((s) => {
      document.getElementById(`panel-${s.name}`).hidden = s.name !== name;
      document.getElementById(`tab-${s.name}`).setAttribute('aria-selected', String(s.name === name));
    });
    if (push) { try { history.replaceState(null, '', `#${name}`); } catch (e) { /* ignore */ } }
  }
  select((location.hash || '').slice(1), false);
  window.addEventListener('hashchange', () => select(location.hash.slice(1), false));

  const seg = document.getElementById('theme');
  const root = document.documentElement;
  function setMode(mode, persist) {
    if (mode === 'system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', mode);
    seg.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
    if (persist) { try { localStorage.setItem('desys-theme', mode); } catch (e) { /* storage unavailable */ } }
  }
  seg.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setMode(b.dataset.mode, true); });
  let saved = null; try { saved = localStorage.getItem('desys-theme'); } catch (e) { saved = null; }
  if (saved === 'light' || saved === 'dark') setMode(saved, false);
  else if (root.getAttribute('data-theme')) setMode(root.getAttribute('data-theme'), false);
})();
</script>
